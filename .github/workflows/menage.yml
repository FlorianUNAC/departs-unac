name: Planning ménage La Grande Motte

on:
  schedule:
    - cron: "17 * * * *"     # toutes les heures
  workflow_dispatch: {}       # lancement manuel depuis l'onglet Actions

permissions:
  contents: write

concurrency:
  group: menage
  cancel-in-progress: false

jobs:
  menage:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Lire le calendrier Airbnb
        env:
          AIRBNB_ICAL_URL: ${{ secrets.AIRBNB_ICAL_URL }}
        run: node scripts/menage-airbnb.mjs
      - name: Publier
        run: |
          git config user.name "robot-unac"
          git config user.email "robot-unac@users.noreply.github.com"
          git add data/menage.json 2>/dev/null || exit 0
          git diff --cached --quiet && exit 0
          git commit -m "Planning ménage mis à jour"
          for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
