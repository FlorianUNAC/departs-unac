<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Planning ménage · Studio La Grande Motte</title>
<meta name="theme-color" content="#0e4f5c">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230e4f5c'/%3E%3Cpath d='M14 42 L32 16 L50 42 Z' fill='%23f4c95d'/%3E%3Cpath d='M10 48 q6 -5 12 0 t12 0 t12 0 t12 0' stroke='%23fff' stroke-width='3' fill='none'/%3E%3C/svg%3E">
<style>
  :root{
    --sea:#0e4f5c; --sea-2:#13697a; --sand:#f7f2ea; --sun:#f4c95d; --coral:#e2725b;
    --ink:#1d2a2e; --muted:#6b7a7e; --line:#e6e0d6; --card:#fff; --ok:#2f8f6b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--sand);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased}
  header{background:var(--sea);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 20px 64px;position:relative;overflow:hidden}
  header::after{content:"";position:absolute;left:-10%;right:-10%;bottom:-38px;height:80px;background:var(--sand);border-radius:50% 50% 0 0/100% 100% 0 0}
  .brand{display:flex;align-items:center;gap:12px}
  .brand svg{flex:none}
  .brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.2px}
  .brand p{margin:2px 0 0;font-size:13.5px;opacity:.8}
  main{max-width:560px;margin:-44px auto 0;padding:0 16px 40px;position:relative;z-index:1}
  .card{background:var(--card);border-radius:18px;box-shadow:0 1px 2px rgba(0,0,0,.04),0 6px 20px rgba(14,79,92,.07);padding:18px}
  .hero .kicker{font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--sea-2)}
  .hero .when{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin:6px 0 2px}
  .hero .rel{font-size:30px;font-weight:800;line-height:1.1}
  .hero .date{font-size:17px;color:var(--muted);text-transform:capitalize}
  .pill{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;padding:6px 11px;border-radius:999px;margin-top:12px}
  .pill.rush{background:#fde8e3;color:#b4432c}
  .pill.calm{background:#e2f3ec;color:var(--ok)}
  .pill.none{background:#eef1f2;color:var(--muted)}
  .hero .next{margin-top:14px;padding-top:14px;border-top:1px dashed var(--line);font-size:15px;color:var(--muted)}
  .hero .next b{color:var(--ink)}
  h2{font-size:14px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:28px 4px 10px;font-weight:700}
  .list{display:flex;flex-direction:column;gap:10px}
  .row{display:flex;gap:14px;align-items:center;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .day{flex:none;width:54px;text-align:center;border-radius:12px;background:var(--sand);padding:6px 0}
  .day .dw{font-size:11.5px;text-transform:uppercase;font-weight:700;color:var(--muted);letter-spacing:.04em}
  .day .dn{font-size:22px;font-weight:800;line-height:1.05}
  .day .dm{font-size:11.5px;text-transform:uppercase;color:var(--muted)}
  .row.rush .day{background:#fde8e3}
  .row.rush .day .dn{color:#b4432c}
  .row .txt{flex:1;min-width:0}
  .row .t1{font-weight:650}
  .row .t2{font-size:14px;color:var(--muted);margin-top:2px}
  .tag{font-size:12px;font-weight:700;padding:3px 8px;border-radius:999px;white-space:nowrap}
  .tag.rush{background:#fde8e3;color:#b4432c}
  .tag.calm{background:#e2f3ec;color:var(--ok)}
  .tag.now{background:#fff4d6;color:#8a6410}
  .cal{background:var(--card);border-radius:18px;padding:14px;box-shadow:0 1px 2px rgba(0,0,0,.04)}
  .cal + .cal{margin-top:10px}
  .cal h3{margin:0 0 10px;font-size:15px;text-transform:capitalize}
  .grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
  .grid .h{font-size:11px;text-align:center;color:var(--muted);font-weight:700;text-transform:uppercase}
  .grid .c{aspect-ratio:1;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:13.5px;font-weight:600;position:relative}
  .c.past{color:#c3c9cb}
  .c.occ{background:#d7ebef;color:var(--sea)}
  .c.clean{background:var(--coral);color:#fff}
  .c.clean.calmc{background:var(--ok)}
  .c.today{outline:2px solid var(--ink);outline-offset:-2px}
  .legend{display:flex;flex-wrap:wrap;gap:14px;font-size:13px;color:var(--muted);margin:12px 4px 0}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:6px}
  .empty{color:var(--muted);text-align:center;padding:22px 10px}
  footer{max-width:560px;margin:0 auto;padding:0 20px 34px;font-size:12.5px;color:var(--muted);text-align:center}
  footer .dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:6px;vertical-align:0}
  footer .dot.stale{background:var(--coral)}
  .skel{height:120px;border-radius:18px;background:linear-gradient(90deg,#fff 0,#f3efe8 50%,#fff 100%);background-size:200% 100%;animation:sk 1.2s infinite}
  @keyframes sk{to{background-position:-200% 0}}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg width="40" height="40" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="14" fill="#13697a"/><path d="M14 42 L32 16 L50 42 Z" fill="#f4c95d"/><path d="M10 48 q6 -5 12 0 t12 0 t12 0 t12 0" stroke="#fff" stroke-width="3" fill="none"/></svg>
    <div>
      <h1>Planning ménage</h1>
      <p>Studio Les Incas · La Grande Motte</p>
    </div>
  </div>
</header>

<main id="app"><div class="skel"></div></main>
<footer id="foot"></footer>

<script>
const TZ = "Europe/Paris", CHECKIN = "16h";
const DATA_URL = "../data/menage.json";

const todayIso = () => new Date().toLocaleDateString("sv-SE", { timeZone: TZ });
const d = iso => new Date(iso + "T12:00:00");
const diffDays = (a, b) => Math.round((d(b) - d(a)) / 864e5);
const fmt = (iso, o) => d(iso).toLocaleDateString("fr-FR", o);
const longDate = iso => fmt(iso, { weekday: "long", day: "numeric", month: "long" });
const plural = (n, w) => n + " " + w + (n > 1 ? "s" : "");
function rel(iso, today) {
  const n = diffDays(today, iso);
  if (n === 0) return "Aujourd’hui";
  if (n === 1) return "Demain";
  if (n < 7) return fmt(iso, { weekday: "long" }).replace(/^./, c => c.toUpperCase());
  return "Dans " + n + " jours";
}
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

function cleanings(stays, today) {
  return stays.filter(s => s.depart >= today).map(s => {
    const next = stays.find(n => n.arrivee >= s.depart);
    const gap = next ? diffDays(s.depart, next.arrivee) : null;
    return { date: s.depart, stay: s, next, gap };
  });
}
function gapPill(c) {
  if (!c.next) return `<span class="pill none">Pas d’arrivée prévue pour l’instant</span>`;
  if (c.gap === 0) return `<span class="pill rush">⏱ Enchaînement le jour même · prêt pour ${CHECKIN}</span>`;
  return `<span class="pill calm">✓ ${plural(c.gap, "jour")} avant la prochaine arrivée</span>`;
}
function gapTag(c) {
  if (!c.next) return "";
  if (c.gap === 0) return `<span class="tag rush">Même jour</span>`;
  return `<span class="tag calm">+${c.gap} j</span>`;
}

function calendar(stays, cl, today, monthOffset) {
  const t = d(today), first = new Date(t.getFullYear(), t.getMonth() + monthOffset, 1, 12);
  const y = first.getFullYear(), m = first.getMonth(), nDays = new Date(y, m + 1, 0).getDate();
  const lead = (first.getDay() + 6) % 7;
  const cleanMap = new Map(cl.map(c => [c.date, c]));
  const iso = day => `${y}-${String(m + 1).padStart(2, "0")}-${String(day).padStart(2, "0")}`;
  let html = `<div class="cal"><h3>${first.toLocaleDateString("fr-FR", { month: "long", year: "numeric" })}</h3><div class="grid">`;
  html += ["L", "M", "M", "J", "V", "S", "D"].map(h => `<div class="h">${h}</div>`).join("");
  html += "<div></div>".repeat(lead);
  for (let day = 1; day <= nDays; day++) {
    const k = iso(day), cls = ["c"];
    const c = cleanMap.get(k);
    if (k < today) cls.push("past");
    else if (c) { cls.push("clean"); if (c.gap !== 0) cls.push("calmc"); }
    else if (stays.some(s => k >= s.arrivee && k < s.depart)) cls.push("occ");
    if (k === today) cls.push("today");
    html += `<div class="${cls.join(" ")}">${day}</div>`;
  }
  return html + "</div></div>";
}

function render(data) {
  const today = todayIso(), stays = (data.sejours || []).slice().sort((a, b) => a.arrivee.localeCompare(b.arrivee));
  const cl = cleanings(stays, today), app = document.getElementById("app");
  const current = stays.find(s => s.arrivee <= today && s.depart > today);
  let html = "";

  if (!cl.length) {
    html += `<section class="card hero"><div class="kicker">Prochain ménage</div><div class="empty">Aucun ménage prévu pour le moment.<br>La page se met à jour automatiquement dès qu’une réservation arrive.</div></section>`;
  } else {
    const c = cl[0];
    html += `<section class="card hero">
      <div class="kicker">Prochain ménage</div>
      <div class="when"><span class="rel">${rel(c.date, today)}</span><span class="date">${longDate(c.date)}</span></div>
      <div>Départ des voyageurs après ${plural(c.stay.nuits, "nuit")}${current && current === c.stay ? " · <b>séjour en cours</b>" : ""}</div>
      ${gapPill(c)}
      <div class="next">${c.next ? `Arrivée suivante : <b>${longDate(c.next.arrivee)}</b> à partir de ${CHECKIN} · ${plural(c.next.nuits, "nuit")}` : "Le studio reste libre après ce ménage."}</div>
    </section>`;
  }

  if (cl.length > 1) {
    html += `<h2>Ménages à venir</h2><div class="list">` + cl.slice(1).map(c => `
      <div class="row ${c.gap === 0 ? "rush" : ""}">
        <div class="day"><div class="dw">${fmt(c.date, { weekday: "short" }).replace(".", "")}</div><div class="dn">${fmt(c.date, { day: "numeric" })}</div><div class="dm">${fmt(c.date, { month: "short" }).replace(".", "")}</div></div>
        <div class="txt"><div class="t1">Ménage · ${rel(c.date, today).toLowerCase()}</div>
          <div class="t2">${c.next ? (c.gap === 0 ? `Nouveaux voyageurs le jour même à ${CHECKIN}` : `Prochaine arrivée ${fmt(c.next.arrivee, { weekday: "long", day: "numeric", month: "long" })}`) : "Pas d’arrivée prévue après"}</div></div>
        ${gapTag(c)}
      </div>`).join("") + `</div>`;
  }

  const upcoming = stays.filter(s => s.depart > today);
  if (upcoming.length) {
    html += `<h2>Réservations</h2><div class="list">` + upcoming.map(s => {
      const now = s.arrivee <= today;
      return `<div class="row">
        <div class="day"><div class="dw">${fmt(s.arrivee, { weekday: "short" }).replace(".", "")}</div><div class="dn">${fmt(s.arrivee, { day: "numeric" })}</div><div class="dm">${fmt(s.arrivee, { month: "short" }).replace(".", "")}</div></div>
        <div class="txt"><div class="t1">${fmt(s.arrivee, { day: "numeric", month: "short" })} → ${fmt(s.depart, { day: "numeric", month: "short" })}</div>
          <div class="t2">${plural(s.nuits, "nuit")} · arrivée ${CHECKIN}</div></div>
        ${now ? `<span class="tag now">En cours</span>` : ""}
      </div>`;
    }).join("") + `</div>`;
  }

  html += `<h2>Calendrier</h2>` + calendar(stays, cl, today, 0) + calendar(stays, cl, today, 1) +
    `<div class="legend"><span><i style="background:#d7ebef"></i>Occupé</span><span><i style="background:var(--coral)"></i>Ménage, arrivée le jour même</span><span><i style="background:var(--ok)"></i>Ménage, sans arrivée le jour même</span></div>`;
  app.innerHTML = html;

  const ago = Date.now() - Date.parse(data.verifie), stale = ago > 8 * 3600e3;
  const when = new Date(data.verifie).toLocaleString("fr-FR", { timeZone: TZ, weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" });
  document.getElementById("foot").innerHTML =
    `<span class="dot ${stale ? "stale" : ""}"></span>Synchronisé avec Airbnb · dernière vérification ${esc(when)}${stale ? "<br>La synchronisation semble en retard, prévenir Florian." : ""}`;
}

async function load() {
  try {
    const r = await fetch(DATA_URL + "?t=" + Date.now(), { cache: "no-store" });
    if (!r.ok) throw new Error(r.status);
    render(await r.json());
  } catch (e) {
    if (!document.querySelector(".hero"))
      document.getElementById("app").innerHTML = `<section class="card"><div class="empty">Planning en cours de préparation.<br>Réessayez dans quelques minutes.</div></section>`;
  }
}
load();
setInterval(load, 10 * 60e3);
document.addEventListener("visibilitychange", () => { if (!document.hidden) load(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js", { scope: "./" }).catch(() => {});
</script>
</body>
</html>
